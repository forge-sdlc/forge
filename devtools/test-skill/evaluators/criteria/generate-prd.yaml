skill: generate-prd
description: "Default PRD scope, evidence, and testability"
gold_standard_file: gold-prd.md
generated_file_patterns:
  - "prd.md"
  - "enhancements/*/prd.md"
judge_model: claude-sonnet-4-6
criteria:
  - id: scope-accuracy
    name: Scope accuracy
    weight: critical
    prompt: Compare with the supplied requirements and gold standard. Are all requested capabilities covered without invented product scope?
  - id: evidence
    name: Evidence and uncertainty
    weight: critical
    prompt: Are constraints and repository claims supported, and missing evidence explicitly uncertain? Flag invented numeric targets or access claims.
  - id: acceptance
    name: Testable requirements
    weight: critical
    prompt: Does every functional requirement have observable acceptance criteria grounded in the requested behavior?
  - id: persona-alignment
    name: Relevant users
    weight: important
    prompt: Are affected users and their goals covered without requiring unrelated personas or inventing users?
  - id: boundaries
    name: Scope boundaries
    weight: important
    prompt: Are scope, assumptions, and dependencies clear and consistent with the gold standard?
  - id: proportionality
    name: Useful detail
    weight: important
    prompt: Does the document explain the product behavior without unnecessary implementation prescriptions, generic sections, or duplicated stories?
pass_threshold: 5
fail_on_critical: true
