apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-api
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        {{- include "forge.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "forge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: AGENT_ROOT_DIR
              value: /var/lib/forge/agent
          {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: redis://{{ include "forge.fullname" . }}-redis:6379/0
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/v1/ready, port: http}
          livenessProbe:
            httpGet: {path: /api/v1/live, port: http}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - name: agent-root
              mountPath: /var/lib/forge
      volumes:
        - name: agent-root
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge.fullname" . }}-api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if .Values.api.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "forge.fullname" . }}
spec:
  {{- with .Values.api.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "forge.fullname" . }}-api
  port:
    targetPort: http
  tls:
    termination: {{ .Values.api.route.tlsTermination }}
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
