apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-worker
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.worker.serviceAccountName }}
      securityContext:
        {{- include "forge.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: initialize-workspace
          image: {{ include "forge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p {{ .Values.skills.directory }}/default"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: workspaces
              mountPath: {{ .Values.workspace.mountPath }}
      containers:
        - name: worker
          image: {{ include "forge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["forge", "worker"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: AGENT_ROOT_DIR
              value: /var/lib/forge/agent
            {{- if .Values.redis.enabled }}
            - name: REDIS_URL
              value: redis://{{ include "forge.fullname" . }}-redis:6379/0
            {{- end }}
            - name: FORGE_SANDBOX_DRIVER
              value: kubernetes
            - name: CONTAINER_IMAGE
              value: {{ include "forge.sandboxImage" . }}
            - name: WORKSPACE_BASE_DIR
              value: {{ .Values.workspace.mountPath }}
            - name: K8S_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: K8S_WORKSPACE_PVC
              value: {{ .Values.workspace.claimName }}
            - name: K8S_WORKSPACE_BASE_PATH
              value: {{ .Values.workspace.mountPath }}
            - name: K8S_IMAGE_PULL_SECRETS
              value: {{ .Values.sandbox.imagePullSecrets | quote }}
            - name: K8S_SERVICE_ACCOUNT
              value: {{ .Values.sandbox.jobServiceAccountName }}
            {{- if .Values.runtimeSecurity.runAsUser }}
            - name: K8S_RUN_AS_USER
              value: {{ .Values.runtimeSecurity.runAsUser | quote }}
            {{- end }}
            {{- if .Values.runtimeSecurity.fsGroup }}
            - name: K8S_FS_GROUP
              value: {{ .Values.runtimeSecurity.fsGroup | quote }}
            {{- end }}
            - name: CONTAINER_MEMORY
              value: {{ .Values.sandbox.memory | quote }}
            - name: CONTAINER_CPUS
              value: {{ .Values.sandbox.cpus | quote }}
            - name: CONTAINER_TIMEOUT
              value: {{ .Values.sandbox.timeout | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
            - name: AGENT_WORKING_DIRECTORY
              value: {{ .Values.workspace.mountPath }}
            {{- if .Values.googleCredentials.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.googleCredentials.mountPath }}
            {{- end }}
            - name: SKILLS_DIR
              value: {{ .Values.skills.directory }}
            - name: K8S_GOOGLE_CREDENTIALS_SECRET
              value: {{ ternary .Values.googleCredentials.existingSecret "" .Values.googleCredentials.enabled | quote }}
            - name: K8S_GOOGLE_CREDENTIALS_KEY
              value: {{ .Values.googleCredentials.key | quote }}
            - name: K8S_GOOGLE_CREDENTIALS_MOUNT_PATH
              value: {{ .Values.googleCredentials.mountPath | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
          volumeMounts:
            - name: agent-root
              mountPath: /var/lib/forge
            - name: workspaces
              mountPath: {{ .Values.workspace.mountPath }}
            {{- if .Values.googleCredentials.enabled }}
            - name: google-credentials
              mountPath: {{ .Values.googleCredentials.mountPath }}
              subPath: {{ .Values.googleCredentials.key }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: agent-root
          emptyDir: {}
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.claimName }}
        {{- if .Values.googleCredentials.enabled }}
        - name: google-credentials
          secret:
            secretName: {{ .Values.googleCredentials.existingSecret }}
        {{- end }}
